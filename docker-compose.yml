services:
  db:
    image: postgres:15-alpine
    container_name: chsherbina-nikita-db-container
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: chsherbina-nikita-student-api:v1.0-chsherbina-nikita
    container_name: chsherbina-nikita-api-container
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      STUDENT_NAME: Nikita
      STUDENT_SURNAME: Chsherbina
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: